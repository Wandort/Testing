<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебный таймер</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стилизовать можно как угодно, тут базовый пример с использованием цветов темы Telegram */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 30px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            transition: all 0.3s ease;
        }
        h2 { margin-bottom: 20px; }
        input[type="date"] {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f4);
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 20px;
            width: 80%;
            outline: none;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Свадебный таймер 💍</h2>
    <p>Выберите дату вашего торжества:</p>
    
    <input type="date" id="weddingDate">
    <button onclick="sendDateToBot()">Сохранить дату</button>

    <script>
        // Инициализируем Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на максимум

        function sendDateToBot() {
            let dateVal = document.getElementById("weddingDate").value;
            
            if (dateVal) {
                // Метод sendData отправляет строку обратно в бота и закрывает Web App
                tg.sendData(dateVal);
            } else {
                tg.showAlert("Пожалуйста, выберите дату!");
            }
        }
    </script>

</body>
</html>
