<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебный таймер Евгений и Ульяна</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibe&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a, #1a1a24);
            color: #fff;
            font-family: 'Playfair Display', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .particle { 
            position: absolute; 
            background: #d4af37; 
            border-radius: 50%; 
            opacity: 0.6; 
            animation: float 10s infinite linear; 
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* --- КНОПКА МУЗЫКИ --- */
        .music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            opacity: 0.7;
        }
        .music-btn:active {
            transform: scale(0.9);
        }
        .music-btn.playing {
            opacity: 1;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            border-color: #d4af37;
        }

        .ring-icon {
            font-size: 3rem;
            margin-bottom: 5px;
            animation: pulse 2.5s infinite;
            z-index: 2;
        }
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.2)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(212,175,55,0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.2)); }
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #d4af37;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            margin-bottom: 5px;
            z-index: 2;
        }

        .date-text {
            font-size: 1rem;
            letter-spacing: 3px;
            color: #cccccc;
            margin-bottom: 25px;
            text-transform: uppercase;
            z-index: 2;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }

        .photo-container {
            z-index: 2;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        .couple-photo {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        .timer-container {
            display: flex;
            gap: 12px;
            z-index: 2;
        }
        
        .time-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 12px 10px;
            min-width: 60px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .time-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 5px;
            font-family: Arial, sans-serif;
        }

        .time-label {
            font-size: 0.7rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            margin-top: 35px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 12px 35px;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s;
            z-index: 2;
        }
        .btn:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* --- АНИМАЦИЯ СТИКЕРОВ --- */
        .celebration-sticker {
            position: absolute;
            font-size: 2.5rem;
            z-index: 9999;
            pointer-events: none; /* Чтобы они не перекрывали клики */
            animation: explode 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        
        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.5);
                opacity: 0;
            }
        }
        /* ------------------------- */
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="music-btn" id="music-toggle" onclick="toggleMusic()">🎵</div>

    <script>
        for(let i=0; i<30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.width = Math.random() * 4 + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 5 + 6) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(p);
        }
    </script>

    <div class="ring-icon">💍</div>
    <div class="names">Евгений & Ульяна</div>
    <div class="date-text">30 марта 2030 года</div>

    <div class="photo-container">
        <!-- Твоя ссылка на фото -->
        <img class="couple-photo" src="we.jpg" alt="Евгений и Ульяна">
    </div>

    <div class="timer-container" id="timer-ui">
        <div class="time-box">
            <div class="time-value" id="days">00</div>
            <div class="time-label">Дней</div>
        </div>
        <div class="time-box">
            <div class="time-value" id="hours">00</div>
            <div class="time-label">Часов</div>
        </div>
        <div class="time-box">
            <div class="time-value" id="minutes">00</div>
            <div class="time-label">Минут</div>
        </div>
        <div class="time-box">
            <div class="time-value" id="seconds">00</div>
            <div class="time-label">Секунд</div>
        </div>
    </div>

    <button class="btn" id="main-btn" onclick="closeWebApp()">Ждём с нетерпением!</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0a0a0a'); 

        const audio = document.getElementById("bg-music");
        const musicBtn = document.getElementById("music-toggle");
        let isPlaying = false;
        audio.volume = 0.3; 

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                musicBtn.classList.remove("playing");
                musicBtn.style.opacity = "0.7";
            } else {
                audio.play();
                musicBtn.classList.add("playing");
                musicBtn.style.opacity = "1";
            }
            isPlaying = !isPlaying;
        }

        const targetDate = new Date("2030-03-30T00:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById('timer-ui').innerHTML = "<h2 style='color:#d4af37; font-size: 2rem;'>Этот счастливый день настал!</h2>";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // --- ЛОГИКА САЛЮТА И ЗАКРЫТИЯ ---
        let isClosing = false; // Защита от двойного клика

        function closeWebApp() {
            if (isClosing) return; 
            isClosing = true;

            const btn = document.getElementById("main-btn");
            btn.innerText = "До встречи! 🤍"; // Меняем текст на кнопке для эффекта
            
            // Набор праздничных стикеров
            const emojis = ['🎉', '💍', '🥂', '🕊️', '❤️', '✨', '💐'];
            
            // Генерируем 50 стикеров
            for (let i = 0; i < 50; i++) {
                let sticker = document.createElement('div');
                sticker.className = 'celebration-sticker';
                sticker.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Стартовая позиция (примерно от центра кнопки)
                sticker.style.left = '50%';
                sticker.style.bottom = '10%';
                
                // Случайное направление разлета (tx и ty передаются в CSS анимацию)
                let tx = (Math.random() - 0.5) * 500 + 'px'; // Разлет влево-вправо
                let ty = (Math.random() - 1) * 600 + 'px';   // Разлет вверх
                
                sticker.style.setProperty('--tx', tx);
                sticker.style.setProperty('--ty', ty);
                
                document.body.appendChild(sticker);
            }

            // Ждем 1.5 секунды, пока пройдет анимация, и закрываем Web App
            setTimeout(() => {
                tg.sendData("waiting");
            }, 1500);
        }
        // --------------------------------
    </script>
</body>
</html>
