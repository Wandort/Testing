<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебный таймер Евгений и Ульяна</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibe&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a, #1a1a24);
            color: #fff;
            font-family: 'Playfair Display', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .particle { 
            position: absolute; 
            background: #d4af37; 
            border-radius: 50%; 
            opacity: 0.6; 
            animation: float 10s infinite linear; 
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        .ring-icon {
            font-size: 3rem;
            margin-bottom: 5px;
            animation: pulse 2.5s infinite;
            z-index: 2;
        }
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.2)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(212,175,55,0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.2)); }
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #d4af37;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            margin-bottom: 5px;
            z-index: 2;
        }

        .date-text {
            font-size: 1rem;
            letter-spacing: 3px;
            color: #cccccc;
            margin-bottom: 25px;
            text-transform: uppercase;
            z-index: 2;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }

        /* --- СТИЛИ ДЛЯ ФОТО --- */
        .photo-container {
            z-index: 2;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        .couple-photo {
            width: 170px; /* Размер фото (ширина) */
            height: 170px; /* Размер фото (высота) */
            object-fit: cover; /* Обрезает фото под круг без искажения пропорций */
            border-radius: 50%; /* Делает фото круглым */
            border: 3px solid #d4af37; /* Золотая рамка */
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5); /* Золотое свечение вокруг */
        }
        /* ------------------------ */

        .timer-container {
            display: flex;
            gap: 12px;
            z-index: 2;
        }
        
        .time-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 12px 10px;
            min-width: 60px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .time-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 5px;
            font-family: Arial, sans-serif;
        }

        .time-label {
            font-size: 0.7rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            margin-top: 35px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 12px 35px;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s;
            z-index: 2;
        }
        .btn:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <script>
        for(let i=0; i<30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.width = Math.random() * 4 + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 5 + 6) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(p);
        }
    </script>

    <div class="ring-icon">💍</div>
    <div class="names">Евгений & Ульяна</div>
    <div class="date-text">30 марта 2030 года</div>

    <!-- === БЛОК С ФОТОГРАФИЕЙ === -->
    <div class="photo-container">
        <!-- ВСТАВЬ СВОЮ ССЫЛКУ ВМЕСТО ТОЙ, ЧТО В КАВЫЧКАХ ПОСЛЕ src= -->
        <img class="couple-photo" src="we.jpg" alt="Евгений и Ульяна">
    </div>
    <!-- ========================= -->

    <div class="timer-container" id="timer-ui">
        <div class="time-box">
            <div class="time-value" id="days">00</div>
            <div class="time-label">Дней</div>
        </div>
        <div class="time-box">
            <div class="time-value" id="hours">00</div>
            <div class="time-label">Часов</div>
        </div>
        <div class="time-box">
            <div class="time-value" id="minutes">00</div>
            <div class="time-label">Минут</div>
        </div>
        <div class="time-box">
            <div class="time-value" id="seconds">00</div>
            <div class="time-label">Секунд</div>
        </div>
    </div>

    <button class="btn" onclick="closeWebApp()">Ждём с нетерпением!</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0a0a0a'); 

        const targetDate = new Date("2030-03-30T00:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById('timer-ui').innerHTML = "<h2 style='color:#d4af37; font-size: 2rem;'>Этот счастливый день настал!</h2>";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        function closeWebApp() {
            tg.sendData("waiting");
        }
    </script>
</body>
</html>
