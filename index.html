<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебный таймер Евгений и Ульяна 💍</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Подключаем роскошный рукописный шрифт из Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibe&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        /* Основные стили, адаптированные под Telegram */
        body {
            font-family: 'Playfair Display', serif; /* Премиальный сериф для текста */
            text-align: center;
            padding: 20px;
            /* Кремовый фон с мягкой текстурой бумаги */
            background-color: #f8f4e6;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10" fill="#f8f4e6"/><rect width="10" height="10" fill="#ede1cc" fill-opacity="0.3"/></svg>');
            color: var(--tg-theme-text-color, #000000);
            transition: all 0.3s ease;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Анимация летящих лепестков */
        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .leaf {
            position: absolute;
            top: -10px;
            font-size: 14px;
            color: #d4af37; /* Золотой цвет */
            opacity: 0;
            animation: fall 10s linear infinite;
        }
        /* Разные лепестки */
        .leaf-1 { left: 5%; animation-delay: 0s; }
        .leaf-2 { left: 20%; animation-delay: 2s; }
        .leaf-3 { left: 40%; animation-delay: 5s; }
        .leaf-4 { left: 60%; animation-delay: 1s; }
        .leaf-5 { left: 80%; animation-delay: 3s; }
        .leaf-6 { left: 95%; animation-delay: 6s; }

        /* Имена пары: Роскошная каллиграфия */
        .couple-names {
            font-family: 'Great Vibes', cursive;
            font-size: 32px;
            color: #d4af37; /* Глубокий золотой */
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .gold-line {
            width: 100%;
            height: 1px;
            background-color: #d4af37;
            margin-bottom: 20px;
        }

        /* Контейнер для фото с рамкой */
        .photo-container {
            position: relative;
            margin-bottom: 25px;
            max-width: 90%;
            display: inline-block;
        }

        .photo-frame {
            border: 2px solid #d4af37; /* Золотая рамка */
            padding: 5px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            background-color: #fff;
        }

        /* Сама фотография (замени URL на свое!) */
        .couple-photo {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            /* Placeholder-заглушка. Обязательно замените URL на вашу реальную фотографию! */
            content: url('https://img.freepik.com/premium-photo/wedding-kiss_23-2148118021.jpg?size=338&ext=jpg&ga=GA1.1.342644121.1718841600&semt=ais_user');
            alt: "Свадебное фото Евгений и Ульяна";
        }

        /* Декор в углах рамки */
        .frame-decor {
            position: absolute;
            width: 20px;
            height: 20px;
            color: #d4af37;
            font-size: 18px;
        }
        .frame-decor-tl { top: -5px; left: -5px; transform: rotate(-45deg); }
        .frame-decor-br { bottom: -5px; right: -5px; transform: rotate(135deg); }

        h2 { 
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--tg-theme-text-color, #000);
        }

        p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--tg-theme-hint-color, #666);
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* Поле ввода даты: Элегантная рамка */
        input[type="date"] {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #d4af37; /* Золотая рамка */
            background-color: var(--tg-theme-secondary-bg-color, #fffef7);
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 25px;
            width: 85%;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            font-family: 'Playfair Display', serif;
        }

        /* Кнопка: Премиальный Telegram-синий с золотом */
        button {
            background: linear-gradient(145deg, #44a4f4, #2a7acc); /* Легкий градиент */
            color: var(--tg-theme-button-text-color, #ffffff);
            border: 1px solid #d4af37; /* Золотая кайма */
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
        }

        /* Эффект сияния при наведении */
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(212, 175, 55, 0.3);
        }
        button:active { transform: translateY(1px); }

    </style>
</head>
<body>

    <!-- Парящие лепестки (декор) -->
    <div class="leaf leaf-1">🌸</div>
    <div class="leaf leaf-2">✨</div>
    <div class="leaf leaf-3">🕊</div>
    <div class="leaf leaf-4">🌸</div>
    <div class="leaf leaf-5">✨</div>
    <div class="leaf leaf-6">🕊</div>

    <!-- Имена пары и декор -->
    <div class="couple-names">Евгений и Ульяна</div>
    <div class="gold-line"></div>

    <!-- Контейнер с фото -->
    <div class="photo-container">
        <div class="photo-frame">
            <img class="couple-photo" src="" alt="Свадебное фото">
        </div>
        <!-- Угловой декор -->
        <div class="frame-decor frame-decor-tl">❦</div>
        <div class="frame-decor frame-decor-br">❦</div>
    </div>

    <!-- Текст и элементы ввода -->
    <h2>Свадебный таймер 💍</h2>
    <p>Пожалуйста, сохраните дату вашего торжества:</p>
    
    <input type="date" id="weddingDate">
    <button onclick="sendDateToBot()">Сохранить дату</button>

    <script>
        // Инициализируем Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на максимум

        function sendDateToBot() {
            let dateVal = document.getElementById("weddingDate").value;
            
            if (dateVal) {
                // Метод sendData отправляет строку обратно в бота и закрывает Web App
                tg.sendData(dateVal);
            } else {
                tg.showAlert("Пожалуйста, выберите дату торжества!");
            }
        }
    </script>

</body>
</html>
